<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI - V5</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { border: 3px solid #ef4444 !important; background-color: #fef2f2 !important; }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; background: black; }
        .modal { display: none; position: fixed; inset: 0; background: white; z-index: 100; overflow-y: auto; }
        .modal.active { display: block; }
        label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 2px; display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-32 font-sans text-slate-900">

    <div class="max-w-xl mx-auto p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black text-blue-900 italic uppercase">RTE <span class="text-blue-500">EMASI</span></h1>
            <button onclick="ouvrirForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-lg">+ NOUVEAU</button>
        </div>

        <div class="flex gap-2 mb-6">
            <input id="search" oninput="chargerDonnees()" type="text" placeholder="Rechercher..." class="flex-1 p-4 rounded-2xl border shadow-sm outline-none bg-white">
            <button onclick="toggleScanner()" class="bg-slate-800 text-white w-14 h-14 rounded-2xl flex items-center justify-center text-xl shadow-lg">📷</button>
        </div>

        <div id="tab-pieces" class="tabs-content active space-y-4">
            <div id="liste-pieces" class="grid gap-4"></div>
        </div>

        <div id="scanner-container" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col p-6">
            <div class="flex justify-between items-center mb-6 text-white">
                <h2 class="font-black uppercase tracking-widest">Scan Code-Barre</h2>
                <button onclick="toggleScanner()" class="text-3xl">✕</button>
            </div>
            <div id="reader"></div>
            <p id="scan-msg" class="text-blue-400 text-center font-bold mt-4"></p>
        </div>

        <div id="modal-form" class="modal p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 id="form-title" class="text-xl font-black text-blue-900 uppercase">Fiche Article</h2>
                <button onclick="fermerForm()" class="text-slate-400 text-2xl font-bold">✕</button>
            </div>

            <div class="space-y-4">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label>Photo de l'article</label>
                    <input type="text" id="photo-url" placeholder="URL de l'image (ou laisser vide)" class="w-full border p-3 rounded-xl bg-slate-50">
                </div>

                <div><label>Désignation</label><input id="nom" type="text" class="w-full border p-3 rounded-xl font-bold"></div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div><label>Code-Barre / QR</label><input id="barcode" type="text" class="w-full border p-3 rounded-xl font-mono text-blue-600"></div>
                    <div><label>Lieu (Ville/Site)</label><input id="lieu" type="text" placeholder="ex: Metz" class="w-full border p-3 rounded-xl"></div>
                </div>

                <div><label>Emplacement Précis</label><input id="emplacement" type="text" placeholder="ex: Armoire A - Rang 2" class="w-full border p-3 rounded-xl"></div>

                <div class="grid grid-cols-3 gap-3">
                    <div><label>Qté Actuelle</label><input id="qty" type="number" value="0" class="w-full border p-3 rounded-xl font-bold text-center"></div>
                    <div><label>Seuil Alerte</label><input id="seuil" type="number" value="2" class="w-full border p-3 rounded-xl font-bold text-center text-red-600"></div>
                    <div><label>Prix (€)</label><input id="prix" type="number" step="0.01" value="0" class="w-full border p-3 rounded-xl text-center"></div>
                </div>

                <div><label>Délai Réappro (Jours)</label><input id="delai" type="number" placeholder="ex: 5" class="w-full border p-3 rounded-xl"></div>

                <button onclick="sauvegarder()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-xl mt-4 active:scale-95 transition-transform">Enregistrer l'Article</button>
            </div>
        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let html5QrCode;

        // CHARGEMENT
        async function chargerDonnees() {
            const search = document.getElementById('search').value.toLowerCase();
            const { data } = await sb.from('produits').select('*').eq('categorie', 'PIECE').order('nom');
            
            const filtered = data.filter(p => p.nom.toLowerCase().includes(search) || (p.barcode && p.barcode.includes(search)));
            
            document.getElementById('liste-pieces').innerHTML = filtered.map(p => `
                <div class="bg-white rounded-[2rem] shadow-sm border overflow-hidden ${p.quantite <= p.seuil_critique ? 'low-stock' : 'border-slate-100'}">
                    <div class="flex gap-4 p-4">
                        <div class="w-20 h-20 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0">
                            <img src="${p.photo_url || 'https://via.placeholder.com/100?text=PIECE'}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-black text-slate-800 text-sm uppercase leading-tight">${p.nom}</h3>
                                <button onclick="ouvrirForm('${p.id}')" class="text-lg">⚙️</button>
                            </div>
                            <p class="text-[10px] text-blue-600 font-bold mt-1">📍 ${p.lieu || '-'} | ${p.emplacement || '-'}</p>
                            <div class="flex gap-4 mt-2">
                                <div class="text-[9px] font-bold"><span class="text-slate-400">PRIX:</span> ${p.prix_unitaire || 0}€</div>
                                <div class="text-[9px] font-bold"><span class="text-slate-400">DÉLAI:</span> ${p.delai_reappro || '?'}j</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-4 flex justify-between items-center border-t border-slate-100">
                        <div class="flex gap-2">
                            <button onclick="updateQty('${p.id}', -1, '${p.nom}')" class="bg-white border w-10 h-10 rounded-xl font-black shadow-sm">-</button>
                            <button onclick="updateStockQuick('${p.id}', 1, '${p.nom}')" class="bg-white border w-10 h-10 rounded-xl font-black shadow-sm">+</button>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black ${p.quantite <= p.seuil_critique ? 'text-red-600' : 'text-blue-900'}">x${p.quantite}</span>
                            <p class="text-[8px] font-bold uppercase text-slate-400">Seuil min: ${p.seuil_critique}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // SCANNER LOGIQUE
        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, async (txt) => {
                    const { data } = await sb.from('produits').select('*').eq('barcode', txt).maybeSingle();
                    if (data) {
                        alert("✅ ARTICLE TROUVÉ : " + data.nom);
                        document.getElementById('search').value = txt;
                        chargerDonnees();
                        toggleScanner();
                    } else {
                        if(confirm("❌ CODE INCONNU. Créer un nouvel article avec ce code ?")) {
                            toggleScanner();
                            ouvrirForm();
                            document.getElementById('barcode').value = txt;
                        }
                    }
                });
            } else { container.classList.add('hidden'); if(html5QrCode) html5QrCode.stop(); }
        }

        // FORMULAIRE
        async function ouvrirForm(id = null) {
            document.getElementById('modal-form').classList.add('active');
            if(id) {
                const { data } = await sb.from('produits').select('*').eq('id', id).single();
                document.getElementById('edit-id').value = data.id;
                document.getElementById('nom').value = data.nom;
                document.getElementById('barcode').value = data.barcode;
                document.getElementById('lieu').value = data.lieu;
                document.getElementById('emplacement').value = data.emplacement;
                document.getElementById('qty').value = data.quantite;
                document.getElementById('seuil').value = data.seuil_critique;
                document.getElementById('prix').value = data.prix_unitaire;
                document.getElementById('delai').value = data.delai_reappro;
                document.getElementById('photo-url').value = data.photo_url || "";
            } else {
                document.querySelectorAll('#modal-form input').forEach(i => i.value = i.type === "number" ? 0 : "");
            }
        }

        function fermerForm() { document.getElementById('modal-form').classList.remove('active'); }

        async function sauvegarder() {
            const payload = {
                nom: document.getElementById('nom').value,
                barcode: document.getElementById('barcode').value,
                lieu: document.getElementById('lieu').value,
                emplacement: document.getElementById('emplacement').value,
                quantite: parseInt(document.getElementById('qty').value),
                seuil_critique: parseInt(document.getElementById('seuil').value),
                prix_unitaire: parseFloat(document.getElementById('prix').value),
                delai_reappro: parseInt(document.getElementById('delai').value),
                photo_url: document.getElementById('photo-url').value,
                categorie: 'PIECE'
            };
            const id = document.getElementById('edit-id').value;
            const { error } = id ? await sb.from('produits').update(payload).eq('id', id) : await sb.from('produits').insert([payload]);
            
            if(!error) { fermerForm(); chargerDonnees(); } else { alert(error.message); }
        }

        async function updateStockQuick(id, diff, nom) {
            const { data } = await sb.from('produits').select('quantite').eq('id', id).single();
            const newQty = Math.max(0, (data.quantite || 0) + diff);
            await sb.from('produits').update({ quantite: newQty }).eq('id', id);
            chargerDonnees();
        }

        chargerDonnees();
    </script>
</body>
</html>
