<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI LORRAINE - V4.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { border: 2px solid #ef4444 !important; background-color: #fef2f2 !important; }
        .status-hs { border: 2px solid #991b1b !important; background-color: #fef2f2 !important; }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; }
        label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .btn-scan-main { position: fixed; bottom: 100px; right: 20px; z-index: 40; }
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen pb-32 font-sans text-slate-900">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black text-blue-900 italic uppercase leading-none">
                RTE <span class="text-blue-500">EMASI</span> <br>
                <span class="text-[10px] tracking-widest text-slate-400 not-italic">LORRAINE</span>
            </h1>
            <button onclick="logout()" id="btn-logout" class="hidden text-[10px] bg-white px-3 py-2 rounded-xl shadow-sm font-bold border border-slate-100 uppercase">Quitter</button>
        </div>

        <button onclick="toggleScanner()" class="btn-scan-main bg-blue-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-2xl border-4 border-white active:scale-90 transition-transform">📷</button>

        <div id="login-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl border mt-10 text-center">
            <h2 class="font-black text-slate-300 mb-8 uppercase tracking-widest text-xs">Accès Inventaire</h2>
            <div class="space-y-4">
                <input id="pseudo" type="text" placeholder="Identifiant" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                <input id="password" type="password" placeholder="Code Secret" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl shadow-lg uppercase tracking-widest active:bg-blue-700">Se connecter</button>
            </div>
        </div>

        <div id="main-app" class="hidden space-y-4">
            
            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 z-50 shadow-lg">
                <button onclick="showTab('pieces')" class="flex flex-col items-center p-2 tab-btn active text-blue-600">📦<span class="text-[9px] font-black mt-1 uppercase">Pièces</span></button>
                <button onclick="showTab('materiel')" class="flex flex-col items-center p-2 tab-btn text-slate-300">🛠️<span class="text-[9px] font-black mt-1 uppercase">Matériel</span></button>
                <button onclick="showTab('achats')" class="flex flex-col items-center p-2 tab-btn text-slate-300">🛒<span class="text-[9px] font-black mt-1 uppercase">Budget</span></button>
                <button onclick="showTab('admin')" class="flex flex-col items-center p-2 tab-btn text-slate-300">⚙️<span class="text-[9px] font-black mt-1 uppercase">Admin</span></button>
            </nav>

            <div id="scanner-container" class="hidden fixed inset-0 bg-black/90 z-[200] flex flex-col p-6">
                <div class="flex justify-between items-center mb-6 text-white">
                    <h2 class="font-black uppercase tracking-widest">Scanner un code</h2>
                    <button onclick="toggleScanner()" class="text-2xl">✕</button>
                </div>
                <div id="reader" class="bg-white rounded-3xl overflow-hidden"></div>
            </div>

            <div id="tab-pieces" class="tabs-content active space-y-4">
                <input id="search" oninput="chargerDonnees()" type="text" placeholder="Chercher une pièce..." class="w-full border p-5 rounded-3xl shadow-sm outline-none bg-white">
                <div id="liste-pieces" class="grid gap-4"></div>
            </div>

            <div id="tab-materiel" class="tabs-content space-y-4">
                <input id="search-mat" oninput="chargerDonnees()" type="text" placeholder="Chercher un appareil..." class="w-full border p-5 rounded-3xl shadow-sm outline-none bg-white">
                <div id="liste-materiel" class="grid gap-4"></div>
            </div>

            <div id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-blue-900 p-8 rounded-[2.5rem] text-white text-center shadow-xl">
                    <p class="text-[10px] uppercase font-black opacity-60">Estimation Réappro</p>
                    <h2 id="total-budget" class="text-4xl font-black mt-1">0.00 €</h2>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </div>

            <div id="tab-admin" class="tabs-content space-y-4">
                <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm">
                    <h2 class="font-black text-xs uppercase text-slate-400 mb-4">Gestion Excel</h2>
                    <div class="grid gap-3">
                        <button onclick="exporterExcel()" class="bg-emerald-500 text-white p-5 rounded-2xl font-black uppercase text-xs">📥 Télécharger le Stock</button>
                        <label class="bg-blue-500 text-white p-5 rounded-2xl font-black uppercase text-xs text-center cursor-pointer">
                            📤 Importer un fichier Excel
                            <input type="file" class="hidden" onchange="importerExcel(event)">
                        </label>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";
        let html5QrCode;

        async function login() {
            const p = document.getElementById('pseudo').value;
            const pw = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email: p.toLowerCase() + "@emasi.stock", password: pw });
            if (error) alert("Identifiants incorrects"); else checkUser();
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                chargerDonnees();
            }
        }

        async function chargerDonnees() {
            const { data } = await sb.from('produits').select('*').order('nom');
            if (data) {
                renderPieces(data.filter(p => (p.categorie || 'PIECE') === 'PIECE'));
                renderMateriel(data.filter(p => p.categorie === 'MATERIEL'));
                calculerBudget(data);
            }
        }

        function renderPieces(data) {
            const s = document.getElementById('search').value.toLowerCase();
            const filtered = data.filter(p => p.nom.toLowerCase().includes(s));
            document.getElementById('liste-pieces').innerHTML = filtered.map(p => `
                <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border ${p.quantite <= p.seuil_critique ? 'low-stock' : 'border-slate-100'}">
                    <div class="flex justify-between">
                        <div><h3 class="font-black text-slate-800 text-sm uppercase">${p.nom}</h3><p class="text-[9px] text-slate-400 font-bold uppercase mt-1">📍 ${p.emplacement || 'Non défini'}</p></div>
                        <span class="text-2xl font-black ${p.quantite <= p.seuil_critique ? 'text-red-600' : 'text-blue-900'}">x${p.quantite}</span>
                    </div>
                    <div class="flex gap-2 mt-4 bg-slate-50 p-2 rounded-2xl">
                        <button onclick="updateStock('${p.id}', -1, '${p.nom}')" class="flex-1 bg-white border h-12 rounded-xl font-black shadow-sm">-</button>
                        <button onclick="updateStock('${p.id}', 1, '${p.nom}')" class="flex-1 bg-white border h-12 rounded-xl font-black shadow-sm">+</button>
                    </div>
                </div>
            `).join('');
        }

        function renderMateriel(data) {
            const s = document.getElementById('search-mat').value.toLowerCase();
            const filtered = data.filter(p => p.nom.toLowerCase().includes(s));
            document.getElementById('liste-materiel').innerHTML = filtered.map(p => `
                <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border ${p.etat === 'HS' ? 'status-hs' : 'border-slate-100'}">
                    <div class="flex justify-between items-center">
                        <div><h3 class="font-black text-slate-800 text-sm uppercase">${p.nom}</h3><p class="text-[9px] text-slate-400 font-bold uppercase mt-1">📍 ${p.emplacement || 'Non défini'}</p></div>
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${p.etat === 'OK' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${p.etat || 'OK'}</span>
                    </div>
                </div>
            `).join('');
        }

        async function updateStock(id, diff, nom) {
            const { data } = await sb.from('produits').select('quantite').eq('id', id).single();
            const newQty = Math.max(0, (data.quantite || 0) + diff);
            await sb.from('produits').update({ quantite: newQty }).eq('id', id);
            await sb.from('historique').insert([{ produit_nom: nom, utilisateur: userPseudo, action: diff > 0 ? "➕ AJOUT" : "➖ SORTIE", quantite_finale: newQty }]);
            chargerDonnees();
        }

        function calculerBudget(data) {
            let total = 0;
            data.forEach(p => {
                if (p.quantite <= p.seuil_critique) {
                    total += (p.seuil_critique + 5 - p.quantite) * (p.prix_unitaire || 0);
                }
            });
            document.getElementById('total-budget').innerText = total.toFixed(2) + " €";
        }

        async function exporterExcel() {
            const { data } = await sb.from('produits').select('*');
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stock");
            XLSX.writeFile(wb, "EMASI_STOCK.xlsx");
        }

        async function importerExcel(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const b = new Uint8Array(evt.target.result);
                const wb = XLSX.read(b, {type:'array'});
                const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const { error } = await sb.from('produits').upsert(data);
                if (error) alert("Erreur: " + error.message); else { alert("Stock mis à jour !"); chargerDonnees(); }
            };
            reader.readAsArrayBuffer(file);
        }

        function toggleScanner() {
            const c = document.getElementById('scanner-container');
            if (c.classList.contains('hidden')) {
                c.classList.remove('hidden');
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                    document.getElementById('search').value = txt;
                    chargerDonnees();
                    toggleScanner();
                });
            } else { c.classList.add('hidden'); if(html5QrCode) html5QrCode.stop(); }
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-300'));
            document.getElementById('tab-' + tab).classList.add('active');
            const btn = [...document.querySelectorAll('.tab-btn')].find(b => b.onclick.toString().includes(tab));
            if(btn) btn.classList.replace('text-slate-300', 'text-blue-600');
        }

        checkUser();
    </script>
</body>
</html>
